<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3557"/>
      <stop offset="1" stop-color="#274b78"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e76f51"/>
      <stop offset="1" stop-color="#c4532f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- stelle -->
  <g fill="#ffd166">
    <path d="M392 92l9 22 22 9-22 9-9 22-9-22-22-9 22-9z"/>
    <circle cx="112" cy="118" r="7"/>
    <circle cx="440" cy="214" r="5"/>
    <circle cx="84" cy="260" r="5"/>
  </g>
  <!-- traiettoria tratteggiata del percorso -->
  <path d="M96 420 C150 380 150 330 210 318" fill="none" stroke="#8ecae6" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 22"/>
  <!-- segnaposto -->
  <path d="M256 448 C256 448 128 316 128 222 A128 128 0 0 1 384 222 C384 316 256 448 256 448 Z" fill="url(#pin)"/>
  <circle cx="256" cy="222" r="84" fill="#fdf6e3"/>
  <!-- cannocchiale dentro il segnaposto, puntato verso la stella -->
  <g transform="rotate(-35 256 236)">
    <rect x="186" y="214" width="150" height="40" rx="10" fill="#c8963e"/>
    <rect x="320" y="204" width="24" height="60" rx="7" fill="#8a5a1f"/>
    <rect x="232" y="214" width="10" height="40" fill="#8a5a1f"/>
    <rect x="176" y="222" width="14" height="24" rx="4" fill="#8a5a1f"/>
