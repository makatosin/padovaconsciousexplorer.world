name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build (sito statico per GitHub Pages)
        run: bun run build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: https://rnsgnhtswfxjjjmbinai.supabase.co
          # Chiave pubblica (publishable): è fatta per stare nel browser, i dati sono protetti da RLS
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0cA891an7EwlvuBOcTEkvA_YSMEr2zw
      # GitHub Pages non conosce le rotte dell'app (/auth, /mappa, ...):
      # 404.html = index.html fa aprire comunque l'app su qualsiasi indirizzo.
      - run: cp dist/client/index.html dist/client/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
